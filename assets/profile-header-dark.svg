<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">alsi-lawr GitHub profile header</title>
  <desc id="desc">Developer tools for the editor, terminal, and runtime.</desc>
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2a8ff"/>
      <stop offset="0.55" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#f2cc60"/>
    </linearGradient>
    <radialGradient id="orb-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-opacity="0.34" stroke-width="1"/>
    </pattern>
    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg-dark)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid-dark)" opacity="0.55"/>
  <circle cx="1045" cy="88" r="210" fill="url(#orb-dark)"/>
  <circle cx="1128" cy="322" r="140" fill="url(#orb-dark)" opacity="0.55"/>

  <g filter="url(#shadow-dark)">
    <rect x="42" y="34" width="1116" height="292" rx="18" fill="#0f141b" stroke="#30363d"/>
  </g>

  <circle cx="70" cy="62" r="6" fill="#ff5f57"/>
  <circle cx="90" cy="62" r="6" fill="#febc2e"/>
  <circle cx="110" cy="62" r="6" fill="#28c840"/>
  <text x="140" y="68" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14">github profile / main</text>
  <line x1="42" y1="88" x2="1158" y2="88" stroke="#30363d"/>

  <text x="76" y="128" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17">$ whoami</text>
  <text x="74" y="193" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="58" font-weight="700" letter-spacing="-2">alsi-lawr</text>
  <rect x="76" y="211" width="610" height="4" rx="2" fill="url(#accent-dark)"/>
